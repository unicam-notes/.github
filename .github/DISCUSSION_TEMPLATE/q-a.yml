body:
- type: markdown
  attributes:
    value: |
      Fai una domanda o avvia una discussione sui corsi. Puoi scrivere in italiano o inglese. Per errori nei materiali, apri una Issue nel repository del corso.

      Ask a question or discuss course topics in Italian or English. To report errors in materials, open an Issue in the course repository.
- type: input
  id: topic
  attributes:
    label: Corso o argomento / Course or topic
    description: Facoltativo per domande generali. / Optional for general questions.
    placeholder: Es. / e.g. Programmazione — ST0851
  validations:
    required: false
- type: textarea
  id: question
  attributes:
    label: Domanda / Question
    placeholder: |
      Descrivi la domanda e ciò che hai già provato. Aggiungi esempi o immagini utili.

      Describe your question and what you have tried. Add helpful examples or images.
  validations:
    required: true
