body:
- type: markdown
  attributes:
    value: 'Inserisci il titolo nel campo di GitHub. Puoi compilare il modulo in italiano o inglese.


      Enter the title in GitHub’s title field. You can complete this form in Italian or English.


      Questo spazio raccoglie le Discussions di tutti i corsi. Indica il corso o repository; invia le
      pull request con materiali al repository del corso.


      Discussions for all courses are centralized here. Specify the course or repository; submit material
      pull requests to the course repository.'
- type: input
  id: topic
  attributes:
    label: Corso o argomento (facoltativo) / Course or topic (optional)
    description: Indica il corso o il link al repository; lascia vuoto per domande generali. / Specify
      the course or repository link; leave blank for general questions.
  validations:
    required: false
- type: textarea
  id: question
  attributes:
    label: Domanda o descrizione / Question or description
  validations:
    required: true
